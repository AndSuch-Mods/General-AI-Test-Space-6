name: Test chapter key player
on:
  push:
    branches: [main]
    paths: ['.github/workflows/test-chapter-key-player.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 install -y -qq ffmpeg
          python -m pip install --quiet cryptography playwright
          python -m playwright install --with-deps chromium webkit
      - name: Check the dual-key player and offline controls using generated test tones
        run: |
          python audio-engine/v5/patch_player.py
          node --check player/player.js
          python audio-engine/v5/test_player_keys.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: player-key-browser-results
          path: /tmp/player-key-tests.json
          if-no-files-found: ignore
          retention-days: 7
