name: Retired parallel audiobook renderer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  use-single-chapter:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - run: |
          echo 'The parallel renderer is retired. Use Render and verify one chapter.'
          echo 'Each chapter must pass live verification before the next request.'
          exit 1
