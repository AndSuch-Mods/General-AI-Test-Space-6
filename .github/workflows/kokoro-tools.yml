name: Build offline neural narration tools
on:
  push:
    paths:
      - '.github/workflows/kokoro-tools.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fetch public model and offline dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle/models bundle/wheels
          python -m pip download --only-binary=:all: --dest bundle/wheels kokoro-onnx
          curl --fail --location --retry 3 'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.int8.onnx' -o bundle/models/kokoro-v1.0.int8.onnx
          curl --fail --location --retry 3 'https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin' -o bundle/models/voices-v1.0.bin
          echo 'ae315a79b623f244700e4afb9246c46a26066782e049ba174bf3ba433970ee9c  bundle/models/kokoro-v1.0.int8.onnx' | sha256sum -c -
          echo 'bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d  bundle/models/voices-v1.0.bin' | sha256sum -c -
          printf '%s\n' 'Kokoro-82M: https://huggingface.co/hexgrad/Kokoro-82M (Apache-2.0).' 'kokoro-onnx: https://github.com/thewh1teagle/kokoro-onnx (MIT).' 'Only public dependencies are included. No book text or private recordings.' > bundle/SOURCES.txt
          cd bundle
          find models wheels -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: offline-kokoro-tools
          path: bundle/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
