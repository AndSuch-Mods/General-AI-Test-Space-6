name: Recover encrypted production checkpoint
on:
  push:
    paths: ['.github/workflows/recover-verified-transfer.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Recover committed and previously uploaded ciphertext
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os,json,base64,hashlib,urllib.request
          dest=Path('/tmp/recovered-transfer');dest.mkdir()
          reports=[]
          for path in sorted(Path('.transfer/v3/all').glob('*.bin')):
              data=path.read_bytes();(dest/path.name).write_bytes(data)
              reports.append({'index':int(path.stem),'bytes':len(data),'git_sha':hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest(),'sha256':hashlib.sha256(data).hexdigest()})
          extra=['3d0592dd57b5cf0ecbb98b4110ee80581b1b5052','46f41d78c0d66207c97d7fceeb77f25a3ee941d7','1ff91a13e749f3eb0e5a44e44202db3d46f4f573','03bda5ffae70ddb167853155aa808e599a5d88b2','bb3d938193416b897106e110a50cb121ca479681','9696de466487a32d1a76fbe1b8fec7e17b6b483d']
          for index,sha in enumerate(extra,36):
              url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs/'+sha
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'encrypted-checkpoint-recovery'})
              with urllib.request.urlopen(req,timeout=30) as response:record=json.load(response)
              data=base64.b64decode(record['content'])
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
              (dest/f'{index:03}.bin').write_bytes(data)
              reports.append({'index':index,'bytes':len(data),'git_sha':sha,'sha256':hashlib.sha256(data).hexdigest()})
          (dest/'report.json').write_text(json.dumps(reports,indent=2))
          print(json.dumps({'pieces':len(reports),'total_bytes':sum(r['bytes'] for r in reports),'verified_git_objects':True}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: recovered-production-checkpoint
          path: /tmp/recovered-transfer/
          compression-level: 0
          retention-days: 7
