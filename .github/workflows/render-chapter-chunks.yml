name: Render and publish verified audio chunks
on:
  push:
    paths: ['.github/workflows/render-chapter-chunks.yml', '.transfer/v3/queue.json']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  actions: read
concurrency:
  group: chapter-audio-publisher
  cancel-in-progress: false
jobs:
  chapter:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install media dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --quiet cryptography numpy scipy soundfile onnxruntime playwright
      - name: Install verified offline speech engine
        run: |
          set -euo pipefail
          mkdir -p /tmp/private-audio/tools/models
          curl --fail --location --retry 3 'https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz' -o /tmp/private-audio/piper.tar.gz
          echo 'a50cb45f355b7af1f6d758c1b360717877ba0a398cc8cbe6d2a7a3a26e225992  /tmp/private-audio/piper.tar.gz' | sha256sum -c -
          tar -xzf /tmp/private-audio/piper.tar.gz -C /tmp/private-audio/tools
          curl --fail --location --retry 3 'https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_GB/vctk/medium/en_GB-vctk-medium.onnx?download=true' -o /tmp/private-audio/tools/models/en_GB-vctk-medium.onnx
          echo '4e9fc85ab9009385319fc6bae7f55577f8a2d7ee77fd9159a5500eb6531f41e6  /tmp/private-audio/tools/models/en_GB-vctk-medium.onnx' | sha256sum -c -
      - name: Receive authenticated chapters and render native-rate audio
        run: |
          python - <<'PY'
          import runpy,pathlib
          result=runpy.run_path('audio-engine/v3/chapter_transfer.py',run_name='__main__')
          p=pathlib.Path('/tmp/private-audio/browser-key.bin');p.write_bytes(result['key']);p.chmod(0o600)
          PY
      - name: Enable chunk reassembly and validate code
        run: |
          python audio-engine/v3/upgrade_player.py
          python -m compileall -q audio-engine/v3
          node --check player/player.js
          node --check player/sw.js
      - name: Publish only verified ciphertext and public player files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add player
          git add -f player/audio-v2
          git commit -m 'Publish verified chapter recordings in pieces under 4 MB'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Rebuild GitHub Pages
        run: gh api --method POST repos/${{ github.repository }}/pages/builds
      - name: Install browsers for actual-recording verification
        run: python -m playwright install --with-deps chromium webkit
      - name: Verify the live app, audio, controls and offline storage
        run: python audio-engine/v3/check_live.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-chapter-verification
          path: qa-results/
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-encrypted-chapters
          path: |
            player/audio-v2/
            player/catalog.json
            player/vault.json
            player/verification.json
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7
      - name: Remove private working files
        if: always()
        run: rm -rf /tmp/private-audio
